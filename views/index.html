<!DOCTYPE html>
<html lang="en" class="bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-awk · Todo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="min-h-screen text-zinc-100 flex items-start justify-center pt-20 px-4">
  <div class="w-full max-w-xl">

    <div class="mb-8">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-mono bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded">gawk</span>
        <span class="text-xs text-zinc-600">+</span>
        <span class="text-xs font-mono bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded">htmx</span>
      </div>
      <h1 class="text-xl font-semibold tracking-tight mt-3">H-awk Todo</h1>
      <p class="text-zinc-500 text-sm mt-1">A minimal demo of the H-awk framework.</p>
    </div>

    <form hx-post="/todos"
          hx-target="#todo-list"
          hx-swap="afterbegin"
          hx-on::after-request="this.reset()"
          class="flex gap-2 mb-6">
      <input name="title"
             type="text"
             placeholder="Add a task…"
             autocomplete="off"
             required
             class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3.5 py-2.5 text-sm
                    text-zinc-100 placeholder-zinc-600
                    focus:outline-none focus:border-zinc-700 transition-colors">
      <button type="submit"
              class="bg-zinc-100 hover:bg-white text-zinc-900 text-sm font-medium
                     px-4 py-2.5 rounded-lg transition-colors whitespace-nowrap cursor-pointer">
        Add
      </button>
    </form>

    <table class="w-full">
      <thead>
        <tr class="border-b border-zinc-800">
          <th class="text-left pb-2.5 text-xs font-medium text-zinc-500 uppercase tracking-wider">Task</th>
          <th class="pb-2.5 w-10"></th>
        </tr>
      </thead>
      <tbody id="todo-list"
             hx-get="/todos"
             hx-trigger="load"
             hx-swap="innerHTML">
      </tbody>
    </table>

  </div>
</body>
</html>
